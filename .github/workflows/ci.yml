name: Validate release
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t team-workload:2.0.0 .
      - name: Start container and check database health
        run: |
          mkdir data
          sudo chown 1000:1000 data
          export ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker compose -f compose.offline.yml up -d --wait --wait-timeout 90
          curl --fail http://localhost:8080/healthz
          docker compose -f compose.offline.yml restart
          sleep 5
          curl --fail http://localhost:8080/healthz
      - if: always()
        run: docker logs team-workload-app || true
