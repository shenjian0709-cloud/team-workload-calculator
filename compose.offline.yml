services:
  app:
    container_name: team-workload-app
    image: team-workload:2.0.0
    pull_policy: never
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/team.db
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (12+ characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
